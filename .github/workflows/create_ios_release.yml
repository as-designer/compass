name: Build iOS Simulator Release Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Assets Directory & File Exist
        run: |
          mkdir -p assets/images assets/icons
          touch assets/images/compass.png
          touch assets/icons/icon.png
          touch assets/icons/icon_fg.png

      - name: Install dependencies
        run: flutter pub get

      - name: Re-generate iOS Project Files & Set Target to 15.0
        run: |
          flutter create . --platforms=ios
          sed -i '' "s/^# platform :ios, '.*/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/^platform :ios, '.*/platform :ios, '15.0'/" ios/Podfile

      # Keep your exact CocoaPods step here!
      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update

      # Keep your exact Flutter build step, just add the "--simulator" flag!
      - name: Build Unsigned iOS App
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons --simulator

      # Package the compiled app folder into a .zip file (Appetize requirements)
      - name: Package Simulator App Bundle
        run: |
          cd build/ios/iphonesimulator
          zip -r ../../../app_release_preview.zip Runner.app

      # Save the Release ZIP file as a downloadable GitHub Artifact
      - name: Upload Release Zip to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-simulator-app
          path: app_release_preview.zip
          retention-days: 1

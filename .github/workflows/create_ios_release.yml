name: Build iOS Simulator Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Assets Directory & File Exist
        run: |
          mkdir -p assets/images assets/icons
          touch assets/images/compass.png
          touch assets/icons/icon.png
          touch assets/icons/icon_fg.png

      - name: Install dependencies
        run: flutter pub get

      - name: Re-generate iOS Project Files & Set Target to 15.0
        run: |
          flutter create . --platforms=ios
          sed -i '' "s/^# platform :ios, '.*/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/^platform :ios, '.*/platform :ios, '15.0'/" ios/Podfile

      # 1. Build SPECIFICALLY for the Simulator architecture
      - name: Build Flutter iOS Simulator App
        run: |
          flutter build ios --simulator --debug --no-tree-shake-icons

      # 2. Package the Runner.app folder into a .zip file
      - name: Package Simulator App Bundle
        run: |
          cd build/ios/iphonesimulator
          zip -r ../../../app_preview.zip Runner.app

      # 3. Save the ZIP file as a downloadable GitHub Artifact (No API token required!)
      - name: Upload Zip to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: my-ios-simulator-app
          path: app_preview.zip
          retention-days: 1 # Automatically deletes from GitHub after 24 hours

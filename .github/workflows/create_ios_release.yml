name: Deploy iOS Browser Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest # GitHub provides a virtual Mac server for you for free

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Assets Directory & File Exist
        run: |
          mkdir -p assets/images assets/icons
          touch assets/images/compass.png
          touch assets/icons/icon.png
          touch assets/icons/icon_fg.png

      - name: Install dependencies
        run: flutter pub get

      - name: Re-generate iOS Project Files & Set Target to 15.0
        run: |
          flutter create . --platforms=ios
          sed -i '' "s/^# platform :ios, '.*/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/^platform :ios, '.*/platform :ios, '15.0'/" ios/Podfile

      # Note: We do NOT run "pod install" manually here; "flutter build" handles it automatically

      # 1. Build SPECIFICALLY for the Simulator architecture instead of iphoneos physical hardware
      - name: Build Flutter iOS Simulator App
        run: |
          flutter build ios --simulator --debug --no-tree-shake-icons

      # 2. Package the Runner.app folder into a .zip file (Appetize Requirement)
      - name: Package Simulator App Bundle
        run: |
          cd build/ios/iphonesimulator
          zip -r ../../../app_preview.zip Runner.app

      # 3. Upload the ZIP file directly to Appetize.io API
      - name: Upload to Appetize.io
        id: upload_app
        run: |
          RESPONSE=$(curl -X POST https://appetize.io \
            -H "X-API-KEY: ${{ secrets.APPETIZE_TOKEN }}" \
            -F "file=@app_preview.zip" \
            -F "platform=ios")
          
          # Extract the unique public build key from Appetize
          PUBLIC_KEY=$(echo $RESPONSE | jq -r '.publicKey')
          
          # Enforce query parameters for clean performance: iPhone 14 + iOS 15
          PREVIEW_URL="https://appetize.io{PUBLIC_KEY}?device=iphone14&osVersion=15.0&autoplay=true"
          echo "PREVIEW_URL=${PREVIEW_URL}" >> $GITHUB_ENV
          
          echo "=========================================================="
          echo "📱 INTERACTIVE PREVIEW LINK:"
          echo "${PREVIEW_URL}"
          echo "=========================================================="

      # 4. Print it directly onto your GitHub Actions run summary page
      - name: Log Preview Link to GitHub Summary
        run: |
          echo "### 📱 Live iOS Browser Preview!" >> $GITHUB_STEP_SUMMARY
          echo "Click the link below to run your app in the browser instantly (No Login Required):" >> $GITHUB_STEP_SUMMARY
          echo "[Open iPhone 14 Simulator Preview](${{ env.PREVIEW_URL }})" >> $GITHUB_STEP_SUMMARY

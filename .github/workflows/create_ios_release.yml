name: Auto-Deploy Debug to Appetize.io

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Assets Directory & File Exist
        run: |
          mkdir -p assets/images assets/icons
          touch assets/images/compass.png
          touch assets/icons/icon.png
          touch assets/icons/icon_fg.png

      - name: Install dependencies
        run: flutter pub get

      - name: Re-generate iOS Project Files & Set Target to 15.0
        run: |
          flutter create . --platforms=ios
          sed -i '' "s/^# platform :ios, '.*/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/^platform :ios, '.*/platform :ios, '15.0'/" ios/Podfile

      # Custom Pod Step
      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update

      # 1. Compile cleanly for the Simulator architecture using Debug flags
      - name: Build Unsigned iOS App
        run: |
          flutter build ios --debug --no-codesign --no-tree-shake-icons --simulator

      # 2. Package the compiled .app folder into a .zip archive for Appetize ingestion
      - name: Package Simulator App Bundle
        run: |
          cd build/ios/iphonesimulator
          zip -r ../../../app_debug_preview.zip Runner.app

      # 3. Securely push the payload package via the Appetize.io REST API
      - name: Push to Appetize.io Cloud API
        id: upload_app
        run: |
          RESPONSE=$(curl -s -X POST https://appetize.io \
            -H "X-API-KEY: ${{ secrets.APPETIZE_TOKEN }}" \
            -F "file=@app_debug_preview.zip" \
            -F "platform=ios")
          
          # Isolate the unique build identifier string
          PUBLIC_KEY=$(echo $RESPONSE | jq -r '.publicKey')
          
          if [ "$PUBLIC_KEY" = "null" ] || [ -z "$PUBLIC_KEY" ]; then
            echo "❌ Error: Appetize.io API upload failed! Raw response:"
            echo "$RESPONSE"
            exit 1
          fi
          
          # Target configuration: Force an iPhone 14 running iOS 15.0 with automated booting
          PREVIEW_URL="https://appetize.io/{PUBLIC_KEY}?device=iphone14&osVersion=15.0&autoplay=true"
          echo "PREVIEW_URL=${PREVIEW_URL}" >> $GITHUB_ENV
          
          echo "=========================================================="
          echo "📱 SECURE INTERACTIVE PREVIEW GENERATED SUCCESSFULLY:"
          echo "${PREVIEW_URL}"
          echo "=========================================================="

      # 4. Expose the finalized streaming link straight inside the Actions UI Summary
      - name: Log Live URL to Actions Summary
        run: |
          echo "### 🚀 Live iOS Browser Preview Ready!" >> $GITHUB_STEP_SUMMARY
          echo "The Debug Simulator build was compiled and pushed safely to the cloud." >> $GITHUB_STEP_SUMMARY
          echo "Click below to execute and play with your Compass app features without logging in:" >> $GITHUB_STEP_SUMMARY
          echo "[🎯 Open iPhone 14 Streaming Window](${{ env.PREVIEW_URL }})" >> $GITHUB_STEP_SUMMARY
